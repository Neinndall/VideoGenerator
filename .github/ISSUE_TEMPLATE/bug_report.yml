name: "🐛 Bug Report"
description: "Report a bug or unexpected behavior in VideoGenerator."
title: "[BUG] "
labels: 
  - "bug"
  - "triage"
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]  
        > Thanks for taking the time to report this bug!
        > Please provide as much context as possible to help us reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: "📝 Description of the Bug"
      description: "Clearly describe the issue you encountered. What did you expect to happen, and what happened instead?"
      placeholder: "A clear and concise description of the bug..."
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: "🛠️ Steps to Reproduce"
      description: "List the exact steps to reproduce the behavior."
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: input
    id: version-os
    attributes:
      label: "💻 App Version & OS"
      description: "e.g., VideoGenerator v1.2.7.0 on Windows 11"
      placeholder: "v1.2.7.0 - Windows 11"
    validations:
      required: true

  - type: textarea
    id: logs-screenshots
    attributes:
      label: "📸 Screenshots, Videos or Logs (Optional)"
      description: "Paste screenshots, error messages, or logs from the `logs` folder (e.g. `application_errors.log`)."
      placeholder: "Drag and drop files here, or paste log content..."
    validations:
      required: false