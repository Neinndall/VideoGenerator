<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Diseño Optimizado para Barra de Tareas (Maximizando el espacio del lienzo) -->
  
  <!-- Cuerpo de la Cámara (Ocupando casi todo el ancho disponible para evitar márgenes vacíos) -->
  <!-- Coordenadas ajustadas para centrar el conjunto total en el lienzo -->
  <rect x="25" y="106" width="350" height="300" rx="50" fill="url(#grad)"/>
  
  <!-- Lente / Parte derecha de la cámara (Agrandada y pegada al borde derecho) -->
  <path d="M385 176L487 96V416L385 336V176Z" fill="url(#grad)"/>
  
  <!-- Símbolo de Play (Proporción aumentada para legibilidad en tamaños pequeños) -->
  <path d="M150 170V342L280 256L150 170Z" fill="white" fill-opacity="1"/>

  <!-- Degradado de Identidad VideoGenerator -->
  <defs>
    <linearGradient id="grad" x1="25" y1="106" x2="487" y2="416" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C4DFF"/>
      <stop offset="1" stop-color="#6200EA"/>
    </linearGradient>
  </defs>
</svg>